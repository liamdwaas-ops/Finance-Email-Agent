name: Daily Portfolio News Brief

on:
  schedule:
    # 06:00 AEST primary plus staggered recovery attempts through 06:30.
    # The script's delivery marker makes every later invocation a no-op once sent.
    - cron: '0,10,20,30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-portfolio-news
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the latest sent-story history
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Send prepared daily brief (or source a fallback)
        env:
          PORTFOLIO_GMAIL_USER: ${{ secrets.PORTFOLIO_GMAIL_USER }}
          PORTFOLIO_GMAIL_APP_PASSWORD: ${{ secrets.PORTFOLIO_GMAIL_APP_PASSWORD }}
          PORTFOLIO_RECIPIENT: ${{ secrets.PORTFOLIO_RECIPIENT }}
        run: python portfolio_digest.py --send-prepared

      - name: Save sent-story history
        run: |
          git config user.name "portfolio-news-bot"
          git config user.email "portfolio-news-bot@users.noreply.github.com"
          git add -A data/
          git diff --cached --quiet || git commit -m "chore: update sent-story history"
          git push

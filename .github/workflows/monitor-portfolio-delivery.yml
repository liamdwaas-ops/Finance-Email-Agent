name: Monitor Portfolio News Delivery

on:
  schedule:
    # 06:35 AEST, immediately after the final 06:30 delivery recovery attempt.
    - cron: '35 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install delivery-check dependency
        run: python -m pip install --requirement requirements.txt

      - name: Verify today's delivery marker
        id: delivery
        run: python portfolio_digest.py --check-delivery

      - name: Create a diagnostic issue for a missed digest
        if: failure() && steps.delivery.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Portfolio digest delivery missing — ${new Date().toISOString().slice(0, 10)}`,
              body: `The 06:35 AEST delivery health check did not find today's persisted delivery marker. Review the failed or delayed Actions runs and the Gmail send step.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
